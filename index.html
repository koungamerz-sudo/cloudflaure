<style>

  /* ---------- Header ---------- */
  header{

  header h1{

  header h1 span{ color:var(--rust-bright); }
  header p{
    margin:0;
    font-size:13px;
    color:var(--text-muted);
    max-width:260px;
    text-align:right;
    line-height:1.5;
  }

  /* ---------- Layout ---------- */
  main{
    flex:1;
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
  }
  @media (max-width:820px){
    main{ grid-template-columns:1fr; }
  }

  /* ---------- Controls panel ---------- */
  aside{
    border-right:1px solid var(--line);
    padding:28px 26px 40px;
    background:var(--bg-panel);
    display:flex;
    flex-direction:column;
    gap:26px;

  .field{ display:flex; flex-direction:column; gap:8px; }
  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;

  .field-row label{ color:var(--paper); }
  .field-row output{ color:var(--rust-bright); font-variant-numeric:tabular-nums; }

  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    height:2px;

    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    margin-top:-6px;
    border:2px solid var(--bg-panel);
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:2px solid var(--bg-panel);
  }
  input[type=range]::-moz-range-track{ height:2px; background:var(--line); }

  fieldset{
    border:none;
    padding:0;
    margin:0;
    display:flex;

  fieldset legend{

  .radio-row{ display:flex; gap:8px; }

  .btn-primary{

  /* ---------- Stage ---------- */
  section.stage{

  .dropzone{

  }

  .dropzone .drop-title{
    font-family:'Oswald', sans-serif;
    font-size:20px;

    margin-bottom:8px;
    text-transform:uppercase;

  }
  .dropzone .drop-sub{ font-size:13px; }

  .compare{
    position:relative;
    max-width:100%;
    max-height:80vh;
    display:none;
    line-height:0;
    box-shadow:0 0 0 1px var(--line);
  }
  .compare canvas{ display:block; max-width:100%; max-height:80vh; width:auto; height:auto; }
  .compare .before-layer{
    position:absolute;
    top:0; left:0;
    height:100%;
    overflow:hidden;
    clip-path:inset(0 50% 0 0);
  }
  .compare .before-layer img{
    display:block;
    height:100%;
    width:auto;
    max-width:none;
  }
  .compare .divider{
    position:absolute;
    top:0; bottom:0;
    left:50%;
    width:1px;
    background:var(--paper);
    pointer-events:none;
  }
  .compare .handle{
    position:absolute;
    top:50%;
    left:50%;
    width:34px; height:34px;
    margin:-17px 0 0 -17px;
    border-radius:50%;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--bg-deep);

  .compare-slider{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    -webkit-appearance:none;
    appearance:none;
    background:transparent;
    margin:0;
    cursor:ew-resize;
  }
  .compare-slider::-webkit-slider-thumb{ opacity:0; width:34px; height:34px; -webkit-appearance:none; }
  .compare-slider::-moz-range-thumb{ opacity:0; width:34px; height:34px; border:none; }
  .compare-slider::-webkit-slider-runnable-track{ background:transparent; }

  .tag{

<script>
(function(){
  const fileInput = document.getElementById('fileInput');
  const chooseBtn = document.getElementById('chooseBtn');
  const dropzone = document.getElementById('dropzone');
  const compareEl = document.getElementById('compare');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const beforeImg = document.getElementById('beforeImg');
  const beforeLayer = document.getElementById('beforeLayer');
  const divider = document.getElementById('divider');
  const compareSlider = document.getElementById('compareSlider');
  const dimsLabel = document.getElementById('dims');

  const sliders = {
    brightness: document.getElementById('brightness'),
    contrast: document.getElementById('contrast'),
    saturation: document.getElementById('saturation'),
    sharpen: document.getElementById('sharpen'),
  };
  const outputs = {
    brightness: document.getElementById('brightnessVal'),
    contrast: document.getElementById('contrastVal'),
    saturation: document.getElementById('saturationVal'),
    sharpen: document.getElementById('sharpenVal'),
  };

  const autoBtn = document.getElementById('autoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  // Offscreen canvas holding the ORIGINAL image at its native size — every
  // render starts from this so repeated adjustments never compound/degrade.
  const srcCanvas = document.createElement('canvas');
  const srcCtx = srcCanvas.getContext('2d');
  let srcLoaded = false;
  let renderQueued = false;

  function currentScale(){
    return parseInt(document.querySelector('input[name=scale]:checked').value, 10);
  }

  chooseBtn.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.style.borderColor = 'var(--rust-bright)'; });
  dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--line)'; });
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--line)';
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  });

  function loadFile(file){
    if (!file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      srcCanvas.width = img.naturalWidth;
      srcCanvas.height = img.naturalHeight;
      srcCtx.drawImage(img, 0, 0);
      srcLoaded = true;

      beforeImg.src = url;
      dropzone.style.display = 'none';
      compareEl.style.display = 'inline-block';

      [autoBtn, resetBtn, downloadBtn].forEach(b => b.disabled = false);
      resetSliders();
      dimsLabel.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px original';
      queueRender();
    };
    img.src = url;
  }

  function resetSliders(){
    sliders.brightness.value = 0;
    sliders.contrast.value = 0;
    sliders.saturation.value = 0;
    sliders.sharpen.value = 0;
    document.getElementById('scale1').checked = true;
    syncOutputs();
  }

  function syncOutputs(){
    outputs.brightness.textContent = sliders.brightness.value;
    outputs.contrast.textContent = sliders.contrast.value;
    outputs.saturation.textContent = sliders.saturation.value;
    outputs.sharpen.textContent = sliders.sharpen.value;
  }

  Object.values(sliders).forEach(s => s.addEventListener('input', () => { syncOutputs(); queueRender(); }));
  document.querySelectorAll('input[name=scale]').forEach(r => r.addEventListener('change', queueRender));
  resetBtn.addEventListener('click', () => { resetSliders(); queueRender(); });

  autoBtn.addEventListener('click', () => {
    // Simple auto-levels: sample the source, find the 1st/99th percentile
    // luminance and stretch contrast/brightness to fill that range.
    const w = srcCanvas.width, h = srcCanvas.height;
    const data = srcCtx.getImageData(0, 0, w, h).data;
    let min = 255, max = 0;
    for (let i = 0; i < data.length; i += 40) {
      const l = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
      if (l < min) min = l;
      if (l > max) max = l;
    }
    const range = Math.max(max - min, 1);
    const contrastBoost = Math.min(60, Math.round((255 - range) / 255 * 120));
    const brightnessBoost = Math.round((128 - (min + max) / 2) / 128 * 40);
    sliders.contrast.value = contrastBoost;
    sliders.brightness.value = Math.max(-60, Math.min(60, brightnessBoost));
    sliders.saturation.value = 15;
    syncOutputs();
    queueRender();
  });

  function queueRender(){
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }

  function render(){
    if (!srcLoaded) return;
    const scale = currentScale();
    const targetW = srcCanvas.width * scale;
    const targetH = srcCanvas.height * scale;

    // Step-doubling upscale: repeatedly doubling size with high-quality
    // smoothing gives noticeably cleaner edges than one big jump.
    let workCanvas = srcCanvas;
    if (scale > 1) {
      let curW = srcCanvas.width, curH = srcCanvas.height;
      let stepCanvas = srcCanvas;
      while (curW < targetW) {
        const nextW = Math.min(curW * 2, targetW);
        const nextH = Math.min(curH * 2, targetH);
        const step = document.createElement('canvas');
        step.width = nextW; step.height = nextH;
        const sctx = step.getContext('2d');
        sctx.imageSmoothingEnabled = true;
        sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(stepCanvas, 0, 0, nextW, nextH);
        stepCanvas = step;
        curW = nextW; curH = nextH;
      }
      workCanvas = stepCanvas;
    }

    canvas.width = workCanvas.width;
    canvas.height = workCanvas.height;
    ctx.drawImage(workCanvas, 0, 0);

    const brightness = parseInt(sliders.brightness.value, 10);
    const contrast = parseInt(sliders.contrast.value, 10);
    const saturation = parseInt(sliders.saturation.value, 10);
    const sharpen = parseInt(sliders.sharpen.value, 10);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    applyColorAdjustments(imageData, brightness, contrast, saturation);
    if (sharpen > 0) applySharpen(imageData, sharpen / 100);
    ctx.putImageData(imageData, 0, 0);

    // Keep the "before" layer sized to match the after canvas so the
    // drag-compare divider lines up pixel-for-pixel.
    beforeImg.style.height = canvas.clientHeight + 'px';
    beforeLayer.style.width = canvas.clientWidth + 'px';
  }

  function applyColorAdjustments(imageData, brightness, contrast, saturation){
    const data = imageData.data;
    const c = (contrast / 100) + 1;              // 0..2
    const cOffset = 128 * (1 - c);
    const s = (saturation / 100) + 1;             // 0..2
    const b = brightness * 1.4;

    for (let i = 0; i < data.length; i += 4) {
      let r = data[i], g = data[i+1], bl = data[i+2];

      // brightness
      r += b; g += b; bl += b;
      // contrast
      r = r * c + cOffset;
      g = g * c + cOffset;
      bl = bl * c + cOffset;
      // saturation (mix toward luminance)
      const gray = 0.299*r + 0.587*g + 0.114*bl;
      r = gray + (r - gray) * s;
      g = gray + (g - gray) * s;
      bl = gray + (bl - gray) * s;

      data[i]   = clamp(r);
      data[i+1] = clamp(g);
      data[i+2] = clamp(bl);
    }
  }

  function clamp(v){ return v < 0 ? 0 : v > 255 ? 255 : v; }

  function applySharpen(imageData, amount){
    const w = imageData.width, h = imageData.height;
    const src = imageData.data;
    const out = new Uint8ClampedArray(src);
    const centerWeight = 1 + 4 * amount;
    const edgeWeight = -amount;

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = (y * w + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          const up    = src[idx - w*4 + ch];
          const down  = src[idx + w*4 + ch];
          const left  = src[idx - 4 + ch];
          const right = src[idx + 4 + ch];
          const center= src[idx + ch];
          const value = center * centerWeight + (up + down + left + right) * edgeWeight;
          out[idx + ch] = clamp(value);
        }
      }
    }
    imageData.data.set(out);
  }

  compareSlider.addEventListener('input', () => {
    const pct = compareSlider.value;
    beforeLayer.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    divider.style.left = pct + '%';
  });

  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'enhanced-photo.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // --- Popunder: fires once on the visitor's first click anywhere on the
  // page. Browsers block window.open() calls that aren't tied to a direct
  // user gesture, so this listens for that first click rather than trying
  // to open on page load (which would silently fail almost everywhere).
  (function initPopunder(){
    const DIRECT_LINK = 'https://www.profitableratecpmnetwork.com/ibrauqzzf?key=c24a25cb3ec362cf2434df9132bd6030';
    const SESSION_KEY = 'popunderShown';

    if (sessionStorage.getItem(SESSION_KEY)) return;

    function handleFirstClick(){
      const win = window.open(DIRECT_LINK, '_blank');
      if (win) win.blur();
      window.focus();
      sessionStorage.setItem(SESSION_KEY, '1');
      document.removeEventListener('click', handleFirstClick);
    }

    document.addEventListener('click', handleFirstClick);
  })();
})();
</script>
